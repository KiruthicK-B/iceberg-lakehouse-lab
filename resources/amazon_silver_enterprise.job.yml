resources:
  jobs:
    amazon_silver_enterprise:
      name: amazon_silver_enterprise
      tags:
        project: ecommerce
        platform: amazon
        layer: enterprise-silver
        direction: downstream
      trigger:
        pause_status: UNPAUSED
        table_update:
          table_names:
            - ${var.catalog}.silver_amazon.stg_amazon__users
            - ${var.catalog}.silver_amazon.stg_amazon__items
            - ${var.catalog}.silver_amazon.stg_amazon__orders
          condition: ANY_UPDATED
          wait_after_last_change_seconds: 60
      tasks:
        - task_key: dbt_intermediate
          environment_key: dbt_env
          dbt_task:
            commands:
              - "dbt run --select path:models/intermediate/amazon"
            project_directory: ../guides/dbt/ecommerce
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: default
            source: WORKSPACE
      environments:
        - environment_key: dbt_env
          spec:
            client: "2"
            dependencies:
              - "dbt-databricks~=1.9.0"
