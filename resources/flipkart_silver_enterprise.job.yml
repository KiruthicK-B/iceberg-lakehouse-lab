resources:
  jobs:
    flipkart_silver_enterprise:
      name: flipkart_silver_enterprise
      tags:
        project: ecommerce
        platform: flipkart
        layer: enterprise-silver
        direction: downstream
      trigger:
        pause_status: UNPAUSED
        table_update:
          table_names:
            - ${var.catalog}.silver_flipkart.stg_flipkart__users
            - ${var.catalog}.silver_flipkart.stg_flipkart__items
            - ${var.catalog}.silver_flipkart.stg_flipkart__orders
          condition: ANY_UPDATED
          wait_after_last_change_seconds: 60
      tasks:
        - task_key: dbt_intermediate
          environment_key: dbt_env
          dbt_task:
            commands:
              - "dbt run --select path:models/intermediate/flipkart"
            project_directory: ../guides/dbt/ecommerce
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: default
            source: WORKSPACE
      environments:
        - environment_key: dbt_env
          spec:
            client: "2"
            dependencies:
              - "dbt-databricks~=1.9.0"
