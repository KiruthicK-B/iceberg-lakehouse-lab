resources:
  jobs:
    shopify_silver:
      name: shopify_silver
      tags:
        project: ecommerce
        platform: shopify
        layer: silver
        direction: downstream
      trigger:
        pause_status: UNPAUSED
        table_update:
          table_names:
            - ${var.catalog}.bronze_shopify.shopify_users_raw
            - ${var.catalog}.bronze_shopify.shopify_items_raw
            - ${var.catalog}.bronze_shopify.shopify_orders_raw
          condition: ANY_UPDATED
          wait_after_last_change_seconds: 60
      tasks:
        - task_key: dbt_staging
          environment_key: dbt_env
          dbt_task:
            commands:
              - "dbt run --select path:models/staging/shopify"
            project_directory: ../guides/dbt/ecommerce
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: default
            source: WORKSPACE
      environments:
        - environment_key: dbt_env
          spec:
            client: "2"
            dependencies:
              - "dbt-databricks~=1.9.0"
