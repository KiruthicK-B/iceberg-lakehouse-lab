x-airflow-common: &airflow-common
  build: .
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Databricks workspace connection -- read from the host shell env, never
    # committed to git. Used by both dbt (via profiles.yml's env_var() calls)
    # and the Bronze ingestion tasks' databricks_conn() (_common.py).
    DATABRICKS_HOST: ${DATABRICKS_HOST:?set DATABRICKS_HOST before starting}
    DATABRICKS_HTTP_PATH: ${DATABRICKS_HTTP_PATH:?set DATABRICKS_HTTP_PATH before starting}
    DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:?set DATABRICKS_TOKEN before starting}
  volumes:
    - ./dags:/opt/airflow/dagsx
    - ../dbt/ecommerce:/opt/airflow/dbt/ecommerce
  depends_on:
    postgres:
      condition: service_healthy

services:

  postgres:
    image: postgres:16
    mem_limit: 256m
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        (airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true)

  airflow-webserver:
    <<: *airflow-common
    mem_limit: 640m
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8090:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  airflow-scheduler:
    <<: *airflow-common
    mem_limit: 3584m
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

volumes:
  airflow-db-data:

networks:
  default:
    name: rustfs_default
    external: true
